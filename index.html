<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f8a62">
<title>טיימר אימונים</title>
<style>
:root{--ink:#14211d;--muted:#6e7b76;--paper:#f5f5ef;--line:#dfe4de;--green:#1f8a62;--dark:#126646;--lime:#d7f37a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--paper);color:var(--ink)}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}.app{min-height:100svh;background:linear-gradient(135deg,#d7f37a22,transparent 38%),var(--paper);overflow:hidden}.shell{width:min(900px,calc(100% - 28px));margin:auto;padding:35px 0}.hero{display:flex;gap:18px;align-items:center;margin-bottom:22px}.logo{width:62px;height:62px;display:grid;place-items:center;border-radius:20px;background:var(--green);color:white;box-shadow:0 14px 30px #1f8a6238}.eyebrow{color:var(--green);font-size:12px;font-weight:900;margin:0 0 6px;letter-spacing:.08em}.hero h1,.stage h1{margin:0;letter-spacing:-.04em}.hero h1{font-size:clamp(34px,7vw,52px)}.hero p:last-child{margin:8px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{display:flex;justify-content:space-between;background:#ffffffaa;border:1px solid var(--line);padding:15px 18px;border-radius:17px}.stat span{color:var(--muted)}.stat b{font-size:19px}.card{background:#ffffffdf;border:1px solid var(--line);border-radius:25px;padding:22px;box-shadow:0 22px 60px #233a3114}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title h2{margin:0;font-size:24px}.saved{background:#edf7e8;color:var(--dark);padding:7px 11px;border-radius:99px;font-size:11px;font-weight:800}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:white;padding:12px;border-radius:17px}.num{width:36px;height:36px;display:grid;place-items:center;background:var(--ink);color:white;border-radius:12px;font-weight:900}.fields{display:flex;justify-content:space-between;align-items:center;gap:15px}.name{min-width:0;width:240px;border:0;border-bottom:1px solid transparent;padding:8px 2px;font-weight:800;outline:0}.name:focus{border-color:var(--green)}.duration{direction:ltr;display:flex;gap:5px;align-items:center}.duration label{display:grid;text-align:center;font-size:9px;color:var(--muted);gap:3px}.duration input{width:56px;height:40px;text-align:center;border:1px solid var(--line);border-radius:11px;font-weight:900}.actions{display:flex;gap:4px}.actions button{border:0;width:32px;height:32px;border-radius:9px;background:#f0f2ee}.actions .del{color:#b43c35;font-size:19px}.actions button:disabled{opacity:.25}.add{width:100%;padding:14px;margin-top:12px;border:1.5px dashed #afbeb3;border-radius:15px;background:transparent;color:var(--dark);font-weight:900}.primary,.secondary{border:0;border-radius:15px;min-height:54px;padding:0 22px;font-weight:900}.primary{background:var(--green);color:white;box-shadow:0 12px 25px #1f8a6238}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.start{display:grid;gap:9px;width:min(430px,100%);margin:20px auto 0}.start small{text-align:center;color:var(--muted)}.workout{width:min(600px,calc(100% - 26px));min-height:100svh;margin:auto;display:flex;flex-direction:column;padding:22px 0}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.back,.reset{border:0;background:transparent}.back{justify-self:start;width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff}.reset{justify-self:end;color:var(--muted);font-size:12px}.step{color:var(--muted);font-size:13px;font-weight:800}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.stage h1{font-size:clamp(32px,9vw,48px);margin-bottom:28px}.ring{width:min(72vw,325px);aspect-ratio:1;border-radius:50%;padding:12px;box-shadow:0 25px 65px #233a311c}.inside{width:100%;height:100%;border-radius:50%;background:white;display:grid;place-content:center}.clock{direction:ltr;font-size:clamp(56px,15vw,78px);line-height:1;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.label{color:var(--muted);font-size:11px;margin-top:11px}.controls{display:grid;gap:9px;width:min(430px,100%);margin:0 auto 16px}.controls .primary{font-size:17px}.next{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#ffffffba;border:1px solid var(--line);border-radius:16px;padding:14px}.next span{color:var(--muted);font-size:11px}.next b:last-child{direction:ltr}.finish{margin:auto;text-align:center;background:#ffffffdf;border:1px solid var(--line);border-radius:28px;padding:40px 25px}.check{width:82px;height:82px;display:grid;place-items:center;margin:0 auto 22px;background:var(--lime);color:var(--dark);border-radius:50%;font-size:40px;font-weight:900}.finish h1{font-size:42px;margin:0 0 10px}.finish>p{color:var(--muted);line-height:1.6}.finish button{display:block;width:min(350px,100%);margin:9px auto}@media(max-width:650px){.shell{padding-top:25px}.hero{align-items:flex-start}.logo{width:50px;height:50px;border-radius:16px}.hero p:last-child{font-size:13px;line-height:1.5}.card{padding:14px}.saved{display:none}.row{grid-template-columns:34px 1fr}.fields{flex-direction:column;align-items:stretch;gap:3px}.name{width:100%}.duration{justify-content:flex-start}.actions{grid-column:2;justify-content:flex-end;margin-top:-36px}}
</style></head><body><main id="app" class="app"></main><script>
var defaults=[{id:"a",name:"תרגיל ראשון",seconds:30},{id:"b",name:"תרגיל שני",seconds:60},{id:"c",name:"תרגיל שלישי",seconds:20}];
var timers=JSON.parse(localStorage.getItem("workout-timers")||"null")||defaults,screen="setup",index=0,remaining=timers[0].seconds,phase="ready",endAt=null,interval=null,app=document.getElementById("app");
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}function save(){localStorage.setItem("workout-timers",JSON.stringify(timers))}function saveSession(){localStorage.setItem("workout-session",JSON.stringify({index:index,remaining:remaining,phase:phase==="running"?"paused":phase}))}
function alarm(){try{var A=window.AudioContext||window.webkitAudioContext,c=new A();[0,.22,.44].forEach(function(d){var o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.28,c.currentTime+d+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d+.16);o.connect(g).connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.18)});setTimeout(function(){c.close()},900);if(navigator.vibrate)navigator.vibrate([180,80,180])}catch(e){}}
function render(){screen==="setup"?renderSetup():renderWorkout()}function renderSetup(){var total=timers.reduce(function(a,t){return a+t.seconds},0),rows="";timers.forEach(function(t,i){rows+='<article class="row"><div class="num">'+(i+1)+'</div><div class="fields"><input class="name" aria-label="שם תרגיל '+(i+1)+'" value="'+esc(t.name)+'" onchange="nameIt('+i+',this.value)"><div class="duration"><label><input type="number" min="0" value="'+Math.floor(t.seconds/60)+'" onchange="part('+i+',&quot;m&quot;,this.value)"><span>דקות</span></label><b>:</b><label><input type="number" min="0" max="59" value="'+(t.seconds%60)+'" onchange="part('+i+',&quot;s&quot;,this.value)"><span>שניות</span></label></div></div><div class="actions"><button onclick="move('+i+',-1)" '+(i===0?"disabled":"")+'>↑</button><button onclick="move('+i+',1)" '+(i===timers.length-1?"disabled":"")+'>↓</button><button class="del" onclick="del('+i+')" '+(timers.length===1?"disabled":"")+'>×</button></div></article>'});var resume=localStorage.getItem("workout-session")?'<button class="secondary" onclick="resumeSaved()">המשך מהנקודה האחרונה</button>':"";app.innerHTML='<section class="shell"><header class="hero"><div class="logo">▶</div><div><p class="eyebrow">האימון שלך, בקצב שלך</p><h1>טיימר אימונים</h1><p>מסדרים פעם אחת את הזמנים—ומתאמנים בלי לגעת בשעון.</p></div></header><div class="stats"><div class="stat"><span>תרגילים</span><b>'+timers.length+'</b></div><div class="stat"><span>זמן עבודה</span><b>'+fmt(total)+'</b></div></div><section class="card"><div class="title"><div><p class="eyebrow">בניית האימון</p><h2>רצף הזמנים שלי</h2></div><span class="saved">נשמר אוטומטית</span></div><div class="list">'+rows+'</div><button class="add" onclick="add()">＋ הוספת זמן נוסף</button></section><div class="start">'+resume+'<button class="primary" onclick="begin()">▶ התחלת האימון מההתחלה</button><small>יישמע צליל קצר בסיום כל זמן</small></div></section>'}
function nameIt(i,v){timers[i].name=v;save()}function part(i,p,v){v=Math.max(0,+v||0);var m=Math.floor(timers[i].seconds/60),s=timers[i].seconds%60;if(p==="m")m=v;else s=Math.min(59,v);timers[i].seconds=Math.max(1,m*60+s);save();render()}function move(i,d){var j=i+d;if(j<0||j>=timers.length)return;var x=timers[i];timers[i]=timers[j];timers[j]=x;save();render()}function del(i){if(timers.length>1){timers.splice(i,1);save();render()}}function add(){timers.push({id:String(Date.now()),name:"תרגיל "+(timers.length+1),seconds:30});save();render()}function begin(){index=0;remaining=timers[0].seconds;phase="ready";screen="workout";saveSession();render()}function resumeSaved(){var s=JSON.parse(localStorage.getItem("workout-session")||"null");if(!s||!timers[s.index])return begin();index=s.index;remaining=Math.min(s.remaining,timers[index].seconds);phase="paused";screen="workout";render()}function setup(){clearInterval(interval);screen="setup";render()}
function renderWorkout(){var t=timers[index],total=timers.reduce(function(a,x){return a+x.seconds},0);if(phase==="finished"){app.innerHTML='<section class="workout"><header class="top"><button class="back" onclick="setup()">→</button></header><div class="finish"><div class="check">✓</div><p class="eyebrow">כל הכבוד</p><h1>האימון הושלם!</h1><p>סיימת '+timers.length+' תרגילים בזמן כולל של '+fmt(total)+'.</p><button class="primary" onclick="restart()">לעשות שוב</button><button class="secondary" onclick="setup()">עריכת האימון</button></div></section>';return}var prog=Math.max(0,Math.min(360,(t.seconds-remaining)/t.seconds*360)),status=phase==="ready"?"מוכן לתרגיל הבא":phase==="paused"?"האימון מושהה":"קדימה!",label=phase==="ready"?(index===0?"התחל":"המשך"):"המשך מהנקודה האחרונה",action=phase==="running"?'<button class="primary" onclick="pause()">Ⅱ עצירה</button>':'<button class="primary" onclick="run()">▶ '+label+'</button>',next=timers[index+1]?esc(timers[index+1].name):"סיום האימון",nextTime=timers[index+1]?fmt(timers[index+1].seconds):"✓";app.innerHTML='<section class="workout"><header class="top"><button class="back" onclick="pause();setup()">→</button><div class="step">תרגיל '+(index+1)+' מתוך '+timers.length+'</div><button class="reset" onclick="restart()">התחלה מחדש</button></header><div class="stage"><p class="eyebrow">'+status+'</p><h1>'+esc(t.name)+'</h1><div class="ring" style="background:conic-gradient(var(--green) '+prog+'deg,#dce3dc 0)"><div class="inside"><span class="clock">'+fmt(remaining)+'</span><span class="label">דקות : שניות</span></div></div></div><div class="controls">'+action+'<button class="secondary" onclick="skip()">דלג לתרגיל הבא</button></div><div class="next"><span>הבא בתור</span><b>'+next+'</b><b>'+nextTime+'</b></div></section>'}
function run(){endAt=Date.now()+remaining*1000;phase="running";clearInterval(interval);interval=setInterval(tick,200);render()}function tick(){remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(remaining<=0){clearInterval(interval);alarm();if(index===timers.length-1){phase="finished";localStorage.removeItem("workout-session")}else{index++;remaining=timers[index].seconds;phase="ready";saveSession()}}else saveSession();render()}function pause(){if(phase!=="running")return;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));clearInterval(interval);phase="paused";saveSession();render()}function restart(){clearInterval(interval);index=0;remaining=timers[0].seconds;phase="ready";saveSession();render()}function skip(){clearInterval(interval);if(index===timers.length-1){phase="finished";localStorage.removeItem("workout-session")}else{index++;remaining=timers[index].seconds;phase="ready";saveSession()}render()}render();
</script></body></html>
